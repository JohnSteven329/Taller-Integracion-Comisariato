info:
  name: 13 - Reingreso de stock al anular
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/api/productos/1/movimientos"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Registra la entrada y restaura el stock", function() {
          const mov = res.body.find(m => m.tipoMovimiento === "Entrada" && m.referenciaId === bru.getVar("ventaId"));
          expect(mov).to.not.be.undefined;
          expect(mov.cantidad).to.equal(2);
          expect(mov.stockNuevo).to.equal(93);
          console.log("Movimiento de entrada: " + JSON.stringify(mov));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
