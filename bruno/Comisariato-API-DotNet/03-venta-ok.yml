info:
  name: 03 - Registrar venta
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/ventas"
  body:
    type: json
    data: |-
      {
        "numeroFactura": "F-DEMO-001",
        "clienteId": 1,
        "empleadoId": 1,
        "formaPago": "Efectivo",
        "productoId": 1,
        "cantidad": 2
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Responde 201 Created", function() {
          expect(res.status).to.equal(201);
        });
        test("El SP calcula subtotal, IVA y total", function() {
          expect(res.body.subtotal).to.equal(2.20);
          expect(res.body.iva).to.equal(0.33);
          expect(res.body.total).to.equal(2.53);
          expect(res.body.estado).to.equal("Completada");
        });
        test("Guarda el id de la venta para anularla", function() {
          bru.setVar("ventaId", res.body.ventaId);
          console.log("Venta creada: " + JSON.stringify(res.body));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
